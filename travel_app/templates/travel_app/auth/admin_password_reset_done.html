{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Your Email | Travelbolt</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

    <main class="min-h-screen flex items-center justify-center px-6">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-gray-200 p-8 text-center">

            <div class="w-16 h-16 mx-auto bg-blue-100 text-blue-600 rounded-full flex items-center justify-center">
                <span class="text-2xl">✉</span>
            </div>

            <h1 class="text-2xl font-bold text-gray-900 mt-5">
                Check Your Email
            </h1>

            <p class="text-gray-500 mt-3 leading-6">
                If an account exists with that email address,
                we've sent instructions for resetting your password.
            </p>

            <a
                href="{% url 'travel_app:admin_login' %}"
                class="inline-flex items-center justify-center mt-6 px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold"
            >
                Back to Login
            </a>

        </div>

    </main>

</body>
</html>
