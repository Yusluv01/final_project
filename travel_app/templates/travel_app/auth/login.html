{% load static %}
<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login | Travelbolt</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-gray-200 p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                    <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">travel_explore</span>
                </div>
                <h1 class="text-2xl font-extrabold text-blue-700">Travelbolt</h1>
                <p class="text-sm text-gray-500 mt-1">Agency Management Suite</p>
            </div>

            <!-- ✅ FIXED: Uses travel_app:login instead of global login -->
            <form method="post" action="{% url 'travel_app:login' %}">
                {% csrf_token %}

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Username</label>
                        <input type="text" name="username" class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Enter your username" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                        <input type="password" name="password" class="w-full px-4 py-3 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Enter your password" required>
                    </div>

                    {% if form.errors %}
                        <div class="bg-red-50 text-red-700 p-3 rounded-lg text-sm border border-red-200">
                            Your username and password didn't match. Please try again.
                        </div>
                    {% endif %}

                    <button type="submit" class="w-full bg-blue-700 text-white py-3 rounded-xl font-bold hover:bg-blue-800 transition-all shadow-lg shadow-blue-200 flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined">login</span>
                        Sign In
                    </button>
                </div>

                <input type="hidden" name="next" value="{{ next }}">
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-500">Demo: <span class="font-mono bg-gray-100 px-2 py-1 rounded">admin / admin123</span></p>
            </div>

            <div class="mt-6 text-center text-xs text-gray-400">
                <p>&copy; 2026 Travelbolt. All rights reserved.</p>
            </div>
        </div>
    </div>
</body>
</html>
