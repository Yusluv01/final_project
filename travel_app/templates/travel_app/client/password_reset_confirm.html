{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Set New Password | Travelbolt</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-50">

    <main class="min-h-screen flex items-center justify-center px-6">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-gray-200 p-8">

            <h1 class="text-2xl font-bold text-gray-900">
                Set New Password
            </h1>

            <p class="text-gray-500 mt-2 mb-6">
                Enter a new password for your Travelbolt account.
            </p>

            {% if validlink %}

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="w-full mt-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold"
                    >
                        Set New Password
                    </button>

                </form>

            {% else %}

                <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-4">

                    This password reset link is invalid or has already been used.

                </div>

                <a
                    href="{% url 'travel_app:client_password_reset' %}"
                    class="inline-block mt-5 text-blue-600 font-semibold"
                >
                    Request a new reset link
                </a>

            {% endif %}

        </div>

    </main>

</body>
</html>
