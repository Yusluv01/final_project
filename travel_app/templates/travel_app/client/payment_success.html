{% extends 'travel_app/client/client_base.html' %}
{% load static %}

{% block title %}Payment Successful | Travelbolt{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white border border-gray-200 rounded-xl shadow-sm p-8 text-center mt-12">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600">
        <span class="material-symbols-outlined text-5xl">check_circle</span>
    </div>
    <h2 class="text-2xl font-extrabold text-gray-900">Payment Successful!</h2>
    <p class="text-gray-500 mt-2">Your booking has been confirmed. We have sent a receipt to your email.</p>
    <a href="{% url 'travel_app:client_dashboard' %}" class="inline-block mt-6 bg-blue-700 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-800">
        Back to Dashboard
    </a>
</div>
{% endblock %}
